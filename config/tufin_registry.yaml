# =============================================================================
# Tufin SecureTrack Asset Intelligence Registry
# =============================================================================
# Resource registry for the Tufin adapter. Where the Elasticsearch registry
# carries ES|QL query bodies, each entry here names a `resource` that the Tufin
# runner maps to one or more SecureTrack REST endpoints and normalizes into the
# same column/row shape (see assetflow/tufin_runner.py).
#
# Endpoint paths follow Tufin's official SecureTrack REST API and pytos SDK:
#   GET /securetrack/api/devices
#   GET /securetrack/api/devices/{id}/revisions      <- who / what / when
#   GET /securetrack/api/revisions/{id}/rules
#   GET /securetrack/api/devices/{id}/rules
#   GET /securetrack/api/devices/{id}/network_objects
#   GET /securetrack/api/devices/{id}/services
#   GET /securetrack/api/devices/{id}/cleanups
#   GET /securetrack/api/zones
#   GET /securetrack/api/audit_logs (availability varies by TOS version)
#
# Status meanings match the Elasticsearch registry:
#   - validated              : Confirmed working against live data.
#   - partially_validated    : Endpoint path confirmed from Tufin's REST API /
#                              pytos SDK; field mapping is best-effort and
#                              needs confirmation against a live TOS release.
#   - investigation_required : Endpoint exists but response shape / availability
#                              varies by TOS version, vendor, or licensing.
#   - not_validated          : Not yet exercised against live data.
# =============================================================================

metadata:
  version: 1
  description: >-
    Tufin SecureTrack configuration, change-history, and asset-intelligence
    resources. Endpoint paths and field mappings confirmed against the
    SecureTrack REST API for TOS R25-2 (SecureTrack 25.2 Swagger).
  query_language: SecureTrack REST
  status_values:
    - validated
    - partially_validated
    - investigation_required
    - not_validated
  categories:
    - Device Inventory
    - Change History
    - Policy Rules
    - Network Objects & Services
    - Segmentation & Topology
    - Policy Hygiene
    - Change Detection

# =============================================================================
# FEEDS
# =============================================================================
feeds:
  - id: FEED-TUF-INVENTORY
    name: Device Inventory
    category: Device Inventory
    description: Managed firewalls, routers, and security devices with vendor, model, and OS version.
    query_ids: [TUF001]
    recommended_refresh_frequency: Daily

  - id: FEED-TUF-CHANGE
    name: Change History
    category: Change History
    description: Per-revision change history — who changed the policy, when, under which ticket and action.
    query_ids: [TUF002]
    recommended_refresh_frequency: Every 5-15 minutes

  - id: FEED-TUF-RULES
    name: Policy Rules
    category: Policy Rules
    description: The effective (latest-revision) rulebase per device — source, destination, service, action.
    query_ids: [TUF003]
    recommended_refresh_frequency: Daily

  - id: FEED-TUF-OBJECTS
    name: Network Objects & Services
    category: Network Objects & Services
    description: Network object and service inventory per device — hosts, subnets, groups, and port/protocol services.
    query_ids: [TUF004, TUF005]
    recommended_refresh_frequency: Daily

  - id: FEED-TUF-TOPOLOGY
    name: Segmentation & Topology
    category: Segmentation & Topology
    description: SecureTrack zones used for segmentation matrices and topology context.
    query_ids: [TUF006]
    recommended_refresh_frequency: Weekly

  - id: FEED-TUF-HYGIENE
    name: Policy Hygiene
    category: Policy Hygiene
    description: Cleanup findings — shadowed, unused, and disabled rules that indicate policy drift and risk.
    query_ids: [TUF007]
    recommended_refresh_frequency: Weekly

  - id: FEED-TUF-CHANGE-DETAIL
    name: Change Detection
    category: Change Detection
    description: Per-change detail computed by diffing consecutive revisions — what changed, who, when, and whether it was authorized.
    query_ids: [TUF008]
    recommended_refresh_frequency: Every 5-15 minutes

  - id: FEED-TUF-REV-RULES
    name: Revision Rulebases
    category: Policy Rules
    description: Per-revision rulebase snapshots that power the Compare Revisions and Revision Policy views — fetch once, then compare/view offline.
    query_ids: [TUF009]
    recommended_refresh_frequency: Daily

# =============================================================================
# QUERIES (resources)
# =============================================================================
queries:
  - id: TUF001
    category: Device Inventory
    name: Device Inventory
    status: validated
    validated: true
    resource: devices
    purpose: Inventory every device SecureTrack manages, with a derived asset type, vendor, model, IP, and OS version.
    expected_output_fields:
      - host.name          # device / CI name (DetailedDeviceDTO.name)
      - device.id
      - asset.type         # derived: Firewall / Firewall Management / Virtual Firewall / Router-Switch / Load Balancer
      - device.vendor      # DetailedDeviceDTO.vendor
      - device.model       # DetailedDeviceDTO.model
      - virtual_type       # DetailedDeviceDTO.virtual_type (vsys/vdom/context)
      - host.ip            # DetailedDeviceDTO.ip
      - os.version         # DetailedDeviceDTO.OS_Version
      - device.domain      # DetailedDeviceDTO.domain_name
      - device.status      # DetailedDeviceDTO.status / offline
      - installed_policy   # DetailedDeviceDTO.installed_policy
    notes: >-
      GET /securetrack/api/devices.json?show_os_version=true. Fields confirmed
      against DetailedDeviceDTO (R25-2). SecureTrack has no explicit device-type
      field, so asset.type is DERIVED from model, virtual_type, and the
      management hierarchy: a device that is the parent of other devices — or
      whose model names a manager (Panorama, FMC, FortiManager, CMA, MDS…) — is
      "Firewall Management"; a device with a virtual_type is a "Virtual Firewall";
      router/switch and load-balancer models are labelled accordingly; everything
      else defaults to "Firewall". host.name is the device name so the row folds
      into the unified host view; it is the anchor for every other Tufin resource.
    recommended_refresh_frequency: Daily

  - id: TUF002
    category: Change History
    name: Device Revisions (Who Changed What, When)
    status: validated
    validated: true
    resource: revisions
    purpose: >-
      Retrieve the policy revision history per device — the core change-intelligence
      signal: which administrator changed the policy, when, under which ticket and action.
    expected_output_fields:
      - host.name              # device
      - revision.id            # RevisionDTO.id (global id, used by /revisions/{id})
      - revision.number        # RevisionDTO.revisionId (order on the device)
      - "@timestamp"           # RevisionDTO.date + time
      - changed_by             # RevisionDTO.admin (device admin via syslog for some vendors)
      - gui_client             # RevisionDTO.guiClient (client/tool that made the change)
      - action                 # RevisionDTO.action
      - ticket                 # RevisionDTO.tickets.ticket[].id linked to the change
      - policy_package         # RevisionDTO.policyPackage
      - authorization_status   # RevisionDTO.authorizationStatus
      - comment                # RevisionDTO.comment.comment
    notes: >-
      GET /securetrack/api/devices/{id}/revisions.json for each device (scan
      capped to bound REST calls; rows capped by limit). Field mapping confirmed
      against RevisionDTO (R25-2): id + revisionId, split date/time, admin,
      guiClient, action, nested comment, and a tickets wrapper (ticket[].id).
      The DTO also carries auditLog and manualAuthorization (status/user/dateTime
      — who authorized the change and when). The acting admin is exposed directly
      for most vendors, and via syslog monitoring for Cisco/Fortinet/Juniper/
      Palo Alto. Supports the time-range control to bound to recent changes.
    recommended_refresh_frequency: Every 5-15 minutes

  - id: TUF003
    category: Policy Rules
    name: Effective Policy Rules
    status: validated
    validated: true
    resource: rules
    purpose: List the effective (latest-revision) firewall rulebase per device.
    expected_output_fields:
      - host.name
      - rule.uid
      - rule.name
      - src_zone           # RuleDTO.src_zone (from_zone)
      - source             # RuleDTO.src_network[]
      - dst_zone           # RuleDTO.dst_zone (to_zone)
      - destination        # RuleDTO.dst_network[]
      - service            # RuleDTO.dst_service[]
      - action
      - track
      - disabled
      - comment
    notes: >-
      GET /securetrack/api/revisions/{latest}/rules.json, falling back to
      /securetrack/api/devices/{id}/rules.json. R25-2 RuleDTO exposes the rule's
      source/destination/service under src_network / dst_network / dst_service
      (arrays of network/service objects) and zones under src_zone / dst_zone —
      NOT generic "source"/"destination" keys. Each is flattened to readable text
      (object display name, or IP for hosts/subnets); an empty list renders as
      "Any". Source/destination were previously blank because the wrong field
      names were read.
    recommended_refresh_frequency: Daily

  - id: TUF004
    category: Network Objects & Services
    name: Network Objects
    status: validated
    validated: true
    resource: network_objects
    purpose: Inventory network objects (hosts, subnets, ranges, groups) defined on each device.
    expected_output_fields:
      - host.name
      - object.id
      - object.name
      - object.type
      - object.ip
      - comment
    notes: >-
      GET /securetrack/api/devices/{id}/network_objects.json. Feeds asset
      discovery — object name/IP maps devices to the hosts and subnets they
      protect. A global /network_objects/search endpoint also exists for lookups.
    recommended_refresh_frequency: Daily

  - id: TUF005
    category: Network Objects & Services
    name: Services
    status: validated
    validated: true
    resource: services
    purpose: Inventory the port/protocol service objects defined on each device.
    expected_output_fields:
      - host.name
      - service.id
      - service.name
      - protocol
      - port
      - type
    notes: >-
      GET /securetrack/api/devices/{id}/services.json. Complements network
      objects for understanding what each rulebase actually permits.
    recommended_refresh_frequency: Daily

  - id: TUF006
    category: Segmentation & Topology
    name: Device Zones
    status: partially_validated
    validated: false
    resource: zones
    purpose: List the zones defined on each device (for zone-based firewalls and segmentation).
    expected_output_fields:
      - host.name
      - zone.id
      - zone.name
      - global
    notes: >-
      GET /securetrack/api/devices/{id}/zones.json per device (PolicyZoneListDTO).
      R25-2 has no global /zones endpoint, so device zones are used instead —
      now host-keyed, joining the unified view. Empty for devices/vendors that
      don't expose named zones. Global segmentation matrices live under
      security_policies (a richer follow-up).
    recommended_refresh_frequency: Weekly

  - id: TUF007
    category: Policy Hygiene
    name: Rule Cleanups (Fully Shadowed)
    status: partially_validated
    validated: false
    resource: cleanups
    purpose: Surface fully shadowed rules — dead rules that can never match, a policy-hygiene signal.
    expected_output_fields:
      - host.name
      - cleanup.type
      - rule.uid
      - rule.name
      - comment
    notes: >-
      GET /securetrack/api/devices/{id}/cleanups.json?code=C01 per device. R25-2
      requires the cleanup category code and only supports C01 (fully shadowed
      rules); results nest under shadowed_rule. Empty when a device has no fully
      shadowed rules. Other cleanup categories are exposed via the estate-wide
      /cleanup results endpoint (a follow-up).
    recommended_refresh_frequency: Weekly

  - id: TUF008
    category: Change Detection
    name: Change Detail (Revision Diff)
    status: validated
    validated: true
    resource: change_detail
    purpose: >-
      Compute per-change detail by diffing each device's most recent revisions:
      what rule changed (added/modified/removed) with before → after, who made
      the change and when, and — when SecureChange ticket authorization is
      enabled — whether the change was authorized and who requested it.
    expected_output_fields:
      - host.name              # device
      - revision.id            # the new revision
      - "@timestamp"           # revision date + time
      - changed_by             # RevisionDTO.admin
      - change_type            # added / modified / removed
      - rule.uid
      - before                 # rule effect before the change
      - after                  # rule effect after the change
      - authorized             # ChangeAuthorizationDTO.status (if enabled)
      - requester              # SecureChange ticket requester_display_name
    notes: >-
      SecureTrack exposes revision *snapshots*, not a field-level changelog, so
      "what changed" is computed: for each device the two most recent revisions
      are fetched (GET /devices/{id}/revisions), their rulebases pulled (GET
      /revisions/{id}/rules) and diffed by rule uid (a rename alone is not a
      change — the fingerprint excludes the rule name). The time-range control
      (24h/7d/30d/90d) selects which revisions to compare: every revision in the
      window plus the one immediately before it (the baseline), diffing each
      consecutive pair so you see every change in the period with its own actor
      and timestamp; with no range it diffs just the latest two. The "Since last
      check" option runs the incremental change-monitoring mode: it diffs only
      the revisions newer than each device's stored watermark, then advances the
      watermark — so every change is reported exactly once with no missed
      intermediate revisions (the first run just records a baseline). The number
      of pairs per device is capped for safety. The authorized/requester columns
      come from GET /change_authorization?old_version=&new_version=,
      which requires "Authorize Revisions with Tickets" enabled in SecureTrack;
      when it is off those columns are blank. Heavier than the other resources
      (several REST calls per device), so the device scan is capped. This is the
      change-intelligence headline — pair it with TUF002 (raw revision history).
    recommended_refresh_frequency: Every 5-15 minutes

  - id: TUF009
    category: Policy Rules
    name: Revision Rulebases (Snapshot)
    status: validated
    validated: true
    resource: revision_rules
    purpose: >-
      Snapshot the full rulebase of each device's recent revisions into the
      database, so the Compare Revisions and Revision Policy views can diff and
      display them offline — fetch once, then compare the fetched data.
    expected_output_fields:
      - host.name          # device
      - device.id
      - revision.id        # the snapshotted revision
      - revision.number
      - "@timestamp"       # revision date + time
      - changed_by         # RevisionDTO.admin
      - rule.uid
      - rule.name
      - src_zone
      - source
      - dst_zone
      - destination
      - service
      - action
      - track
      - disabled
      - comment
    notes: >-
      For each device (scan capped), the recent revisions are selected — the
      latest 5 by default, or every revision within the time-range window
      (24h/7d/30d/90d), capped at 30 — and each revision's rulebase is pulled
      (GET /securetrack/api/revisions/{id}/rules.json) and flattened to one row
      per rule, tagged with the revision id/number/date/admin. This is the
      persisted backing store for the "🔀 Compare Revisions" and "📜 Revision
      Policy" overviews: they read the latest saved snapshot and compute the
      New/Deleted/Modified/Moved diff (and the full per-revision rulebase) from
      these rows — no live SecureTrack call at view time. Heavier than the other
      resources (a rules call per revision per device), so refresh it on a
      schedule or via Fetch-all rather than constantly. Widen the time range to
      capture more history for comparison.
    recommended_refresh_frequency: Daily
