# =============================================================================
# Asset Intelligence Query Registry
# =============================================================================
# Predefined Asset Intelligence ES|QL query registry for assetFlow.
#
# These queries have been validated (or partially validated) against a live
# Elasticsearch environment. Each entry documents the query, its validation
# status, the fields it is expected to return, and how often it should be run.
#
# Supported statuses:
#   - validated              : Confirmed working against live data.
#   - partially_validated    : Query runs, but some fields/behaviour need
#                              further mapping validation.
#   - investigation_required : Additional research needed before relying on it.
#   - not_validated          : Not yet tested against live data.
# =============================================================================

metadata:
  version: 2
  description: Preloaded Elastic Asset Intelligence queries for assetFlow.
  query_language: ES|QL
  status_values:
    - validated
    - partially_validated
    - investigation_required
    - not_validated
  categories:
    - Identity Intelligence
    - User Management Changes
    - Service Change Intelligence
    - Application Discovery
    - Database Discovery
    - File Integrity Monitoring
    - Authentication & Access Changes
    - Security Configuration Changes

# =============================================================================
# FEEDS
# =============================================================================
# Category-level Asset Intelligence data feeds. Downstream consumers (e.g.
# Oravuno) should subscribe to a feed rather than to individual query ids; the
# feed groups related queries into one standardized, refreshable stream.
# 'query_ids' lists the member queries defined under 'queries:' below.
# =============================================================================

feeds:
  - id: FEED-IDENTITY
    name: Identity Intelligence
    category: Identity Intelligence
    description: User-to-device ownership and identity mapping.
    query_ids: [AI001]
    recommended_refresh_frequency: Daily

  - id: FEED-USER-MGMT
    name: User Management Changes
    category: User Management Changes
    description: Account lifecycle (create/enable/disable/delete) and security group membership change events.
    query_ids: [AI002, AI003, AI004, AI005, AI006]
    recommended_refresh_frequency: Hourly

  - id: FEED-SERVICE-CHANGE
    name: Service Change Intelligence
    category: Service Change Intelligence
    description: Service installation, creation, and startup-type change events.
    query_ids: [AI007, AI008, AI009]
    recommended_refresh_frequency: Hourly

  - id: FEED-APP-DISCOVERY
    name: Application Discovery
    category: Application Discovery
    description: Application and service footprint across hosts, including software version discovery.
    query_ids: [AI010, AI011, AI012, AI016]
    recommended_refresh_frequency: Daily

  - id: FEED-DB-DISCOVERY
    name: Database Discovery
    category: Database Discovery
    description: Database engine discovery, host inventory, and version discovery.
    query_ids: [AI013, AI014, AI015]
    recommended_refresh_frequency: Daily

  - id: FEED-FILE-INTEGRITY
    name: File Integrity Monitoring
    category: File Integrity Monitoring
    description: File create/modify/delete change monitoring. Placeholder feed; query not yet defined.
    query_ids: [AI017]
    recommended_refresh_frequency: Hourly

  - id: FEED-AUTH-ACCESS
    name: Authentication & Access Changes
    category: Authentication & Access Changes
    description: Privileged logon, account lockout, password reset, and failed-logon change events.
    query_ids: [AI018, AI019, AI020, AI021]
    recommended_refresh_frequency: Hourly

  - id: FEED-SEC-CONFIG
    name: Security Configuration Changes
    category: Security Configuration Changes
    description: Scheduled task creation, audit-policy change, event-log clearing, and host firewall rule changes.
    query_ids: [AI022, AI023, AI024, AI025]
    recommended_refresh_frequency: Hourly

queries:
  # ===========================================================================
  # IDENTITY INTELLIGENCE
  # ===========================================================================

  - id: AI001
    category: Identity Intelligence
    name: User Device Mapping
    status: validated
    validated: true
    purpose: Map users to devices and identify ownership patterns.
    esql_query: |
      FROM logs-*
      | WHERE user.name IS NOT NULL
      | WHERE user.name != "SYSTEM"
      | STATS
          LoginCount = COUNT(),
          LastLogin = MAX(@timestamp),
          SourceIPs = VALUES(source.ip),
          SourcePorts = VALUES(source.port)
      BY host.name, host.ip, user.name
      | SORT host.name ASC, LastLogin DESC
    expected_output_fields:
      - host.name
      - host.ip
      - user.name
      - LoginCount
      - LastLogin
      - SourceIPs
      - SourcePorts
    notes: >-
      Validated successfully. Provides user ownership, login frequency,
      source IP visibility, and source port visibility.
    recommended_refresh_frequency: Daily

  - id: AI002
    category: User Management Changes
    name: User Created
    status: validated
    validated: true
    purpose: Detect creation of user accounts.
    esql_query: |
      FROM logs-*
      | WHERE event.code == "4720"
      | KEEP
          @timestamp,
          host.name,
          winlog.event_data.SubjectUserName,
          winlog.event_data.TargetUserName
      | SORT @timestamp DESC
    expected_output_fields:
      - "@timestamp"
      - host.name
      - winlog.event_data.SubjectUserName
      - winlog.event_data.TargetUserName
    notes: Detects Windows event code 4720 (a user account was created).
    recommended_refresh_frequency: Hourly

  - id: AI003
    category: User Management Changes
    name: User Enabled
    status: validated
    validated: true
    purpose: Detect enabling of user accounts.
    esql_query: |
      FROM logs-*
      | WHERE event.code == "4722"
      | KEEP
          @timestamp,
          host.name,
          winlog.event_data.SubjectUserName,
          winlog.event_data.TargetUserName
      | SORT @timestamp DESC
    expected_output_fields:
      - "@timestamp"
      - host.name
      - winlog.event_data.SubjectUserName
      - winlog.event_data.TargetUserName
    notes: Detects Windows event code 4722 (a user account was enabled).
    recommended_refresh_frequency: Hourly

  - id: AI004
    category: User Management Changes
    name: User Disabled
    status: validated
    validated: true
    purpose: Detect disabling of user accounts.
    esql_query: |
      FROM logs-*
      | WHERE event.code == "4725"
      | KEEP
          @timestamp,
          host.name,
          winlog.event_data.SubjectUserName,
          winlog.event_data.TargetUserName
      | SORT @timestamp DESC
    expected_output_fields:
      - "@timestamp"
      - host.name
      - winlog.event_data.SubjectUserName
      - winlog.event_data.TargetUserName
    notes: Detects Windows event code 4725 (a user account was disabled).
    recommended_refresh_frequency: Hourly

  - id: AI005
    category: User Management Changes
    name: User Deleted
    status: validated
    validated: true
    purpose: Detect deletion of user accounts.
    esql_query: |
      FROM logs-*
      | WHERE event.code == "4726"
      | KEEP
          @timestamp,
          host.name,
          winlog.event_data.SubjectUserName,
          winlog.event_data.TargetUserName
      | SORT @timestamp DESC
    expected_output_fields:
      - "@timestamp"
      - host.name
      - winlog.event_data.SubjectUserName
      - winlog.event_data.TargetUserName
    notes: Detects Windows event code 4726 (a user account was deleted).
    recommended_refresh_frequency: Hourly

  - id: AI006
    category: User Management Changes
    name: Group Membership Changes
    status: validated
    validated: true
    purpose: Detect users added to security groups.
    esql_query: |
      FROM logs-*
      | WHERE event.code IN ("4728","4732","4756")
      | KEEP
          @timestamp,
          host.name,
          event.code,
          winlog.event_data.SubjectUserName,
          winlog.event_data.TargetUserName,
          group.name,
          group.id
      | SORT @timestamp DESC
    expected_output_fields:
      - "@timestamp"          # Time
      - host.name             # Host
      - winlog.event_data.SubjectUserName  # Actor
      - winlog.event_data.TargetUserName   # Target User
      - group.name            # Group
      - group.id              # Group SID
      - event.code            # Change Type
    notes: >-
      Detects membership additions across global (4728), local (4732), and
      universal (4756) security groups. event.code identifies the change type.
    recommended_refresh_frequency: Hourly

  # ===========================================================================
  # SERVICE CHANGE INTELLIGENCE
  # ===========================================================================

  - id: AI007
    category: Service Change Intelligence
    name: Service Installed
    status: validated
    validated: true
    purpose: Detect service installation events.
    esql_query: |
      FROM logs-*
      | WHERE event.code == "4697"
      | KEEP
          @timestamp,
          host.name,
          host.ip,
          service.name,
          winlog.event_data.ServiceName,
          winlog.event_data.ServiceFileName,
          user.name
      | SORT @timestamp DESC
    expected_output_fields:
      - "@timestamp"
      - host.name
      - host.ip
      - service.name
      - winlog.event_data.ServiceName
      - winlog.event_data.ServiceFileName
      - user.name
    notes: >-
      Field validation completed. Detects Windows event code 4697 (a service
      was installed). ServiceName and ServiceFileName are available.
    recommended_refresh_frequency: Hourly

  - id: AI008
    category: Service Change Intelligence
    name: Service Created
    status: validated
    validated: true
    purpose: Detect newly created services.
    esql_query: |
      FROM logs-*
      | WHERE event.code == "7045"
      | KEEP
          @timestamp,
          host.name,
          host.ip,
          winlog.event_data.ServiceName
      | SORT @timestamp DESC
    expected_output_fields:
      - "@timestamp"
      - host.name
      - host.ip
      - winlog.event_data.ServiceName
    notes: >-
      Detects Windows event code 7045 (a new service was installed).
      Examples observed: WinDivert, BeyondTrust Remote Execution Service,
      tenable_mw_scan.
    recommended_refresh_frequency: Hourly

  - id: AI009
    category: Service Change Intelligence
    name: Startup Type Changes
    status: partially_validated
    validated: false
    purpose: Detect Windows service startup mode changes.
    esql_query: |
      FROM logs-*
      | WHERE event.code == "7040"
    expected_output_fields:
      - "@timestamp"
      - host.name
      - service.name          # not reliably populated
      - winlog.event_data.ServiceStartType  # not reliably populated
    notes: >-
      Event exists (Windows event code 7040, service start type changed).
      Related fields require further mapping validation. Fields not reliably
      populated: service.name, ServiceStartType.
    recommended_refresh_frequency: Hourly

  # ===========================================================================
  # APPLICATION DISCOVERY
  # ===========================================================================

  - id: AI010
    category: Application Discovery
    name: Application Discovery By Service
    status: validated
    validated: true
    purpose: Identify applications and services deployed across servers.
    esql_query: |
      FROM logs-*
      | WHERE service.name IS NOT NULL
      | STATS Hosts = COUNT_DISTINCT(host.name)
      BY service.name
      | SORT Hosts DESC
    expected_output_fields:
      - service.name          # Application
      - Hosts                 # Host Count
    notes: >-
      Aggregates distinct host counts per service. Examples observed:
      Elastic Agent, GoogleUpdaterService, Zabbix Agent 2.
    recommended_refresh_frequency: Daily

  - id: AI011
    category: Application Discovery
    name: Host Application Mapping
    status: validated
    validated: true
    purpose: Identify applications running on each host.
    esql_query: |
      FROM logs-*
      | WHERE service.name IS NOT NULL
      | STATS
          Applications = VALUES(service.name)
      BY host.name
      | SORT host.name ASC
    expected_output_fields:
      - host.name
      - Applications
    notes: Lists the set of services observed per host.
    recommended_refresh_frequency: Daily

  - id: AI012
    category: Application Discovery
    name: Application Footprint
    status: validated
    validated: true
    purpose: Identify all servers running a given service.
    esql_query: |
      FROM logs-*
      | WHERE service.name IS NOT NULL
      | STATS
          HostCount = COUNT_DISTINCT(host.name),
          Hosts = VALUES(host.name)
      BY service.name
      | SORT HostCount DESC
    expected_output_fields:
      - service.name
      - HostCount
      - Hosts
    notes: Inverse of host mapping; lists every host running each service.
    recommended_refresh_frequency: Daily

  # ===========================================================================
  # DATABASE DISCOVERY
  # ===========================================================================

  - id: AI013
    category: Database Discovery
    name: Database Process Discovery
    status: partially_validated
    validated: false
    purpose: Identify database technologies deployed on servers.
    esql_query: |
      FROM logs-*
      | WHERE process.name RLIKE "(?i).*sqlservr.*|.*oracle.*"
      | KEEP
          host.name,
          host.ip,
          process.name,
          process.executable
      | SORT host.name ASC
    expected_output_fields:
      - host.name
      - host.ip
      - process.name
      - process.executable
    notes: >-
      Validated findings: sqlservr.exe detected, oracle.exe detected.
      Regex pattern matching may need broadening for additional DB engines.
    recommended_refresh_frequency: Daily

  - id: AI014
    category: Database Discovery
    name: Database Host Inventory
    status: partially_validated
    validated: false
    purpose: Build inventory of database hosts.
    esql_query: |
      FROM logs-*
      | WHERE process.name RLIKE "(?i).*sqlservr.*|.*oracle.*"
      | STATS
          DatabaseProcesses = VALUES(process.name)
      BY host.name, host.ip
      | SORT host.name ASC
    expected_output_fields:
      - host.name
      - host.ip
      - DatabaseProcesses
    notes: >-
      Aggregates discovered database processes per host. Depends on the same
      process.name matching as AI013 and inherits its partial validation.
    recommended_refresh_frequency: Daily

  - id: AI015
    category: Database Discovery
    name: Database Version Discovery
    status: investigation_required
    validated: false
    purpose: Identify exact DB versions.
    esql_query: |
      FROM logs-*
      | WHERE process.name RLIKE "(?i).*sqlservr.*|.*oracle.*"
      | KEEP
          host.name,
          host.ip,
          process.name,
          process.executable
      | SORT host.name ASC
    expected_output_fields:
      - host.name
      - host.ip
      - process.name
      - process.executable
    notes: >-
      Version cannot yet be read directly. SQL Server executable observed:
      C:\Program Files\Microsoft SQL Server\MSSQL14.MSSQLSERVER\MSSQL\Binn\sqlservr.exe.
      Possible version inference: MSSQL14 -> SQL Server 2017 (derived from the
      executable path). However, no validated package.version or process.pe.*
      version fields are populated, so exact version detection requires further
      investigation before it can be relied upon.
    recommended_refresh_frequency: Daily

  # ---------------------------------------------------------------------------
  # PLACEHOLDERS (not yet written / not validated)
  # ---------------------------------------------------------------------------

  - id: AI016
    category: Application Discovery
    name: Software Version Discovery
    status: partially_validated
    validated: false
    purpose: Identify installed software and their versions across hosts.
    esql_query: |
      FROM logs-*
      | WHERE package.name IS NOT NULL
      | KEEP host.name, host.ip, package.name, package.version
      | SORT host.name ASC
    expected_output_fields:
      - host.name
      - host.ip
      - package.name
      - package.version
    notes: >-
      Lists installed software and versions per host from package.* fields,
      populated by a software/package inventory source (e.g. the Elastic system
      package dataset or an endpoint agent). Returns no rows if package.* isn't
      ingested — confirm the fields exist in the target environment.
    recommended_refresh_frequency: Daily

  - id: AI017
    category: File Integrity Monitoring
    name: File Integrity Monitoring
    status: partially_validated
    validated: false
    purpose: Detect create/modify/delete changes to monitored files.
    esql_query: |
      FROM logs-*
      | WHERE file.path IS NOT NULL AND event.action IS NOT NULL
      | WHERE event.action RLIKE "(?i).*(creat|delet|modif|chang|renam|overwrit).*"
      | KEEP @timestamp, host.name, file.path, event.action, user.name
      | SORT @timestamp DESC
    expected_output_fields:
      - "@timestamp"
      - host.name
      - file.path
      - event.action
      - user.name
    notes: >-
      File create/modify/delete/rename events, filtered on event.action. Requires
      a file-integrity data source (Elastic FIM, auditd file events, or Sysmon
      file events). Returns no rows if no FIM data is ingested. Assigned its own
      feed (FEED-FILE-INTEGRITY).
    recommended_refresh_frequency: Hourly

  # ===========================================================================
  # AUTHENTICATION & ACCESS CHANGES
  # ===========================================================================

  - id: AI018
    category: Authentication & Access Changes
    name: Privileged Logon
    status: validated
    validated: true
    purpose: Detect logons granted special/administrative privileges.
    esql_query: |
      FROM logs-*
      | WHERE event.code == "4672"
      | KEEP
          @timestamp,
          host.name,
          winlog.event_data.SubjectUserName,
          winlog.event_data.PrivilegeList
      | SORT @timestamp DESC
    expected_output_fields:
      - "@timestamp"
      - host.name
      - winlog.event_data.SubjectUserName
      - winlog.event_data.PrivilegeList
    notes: >-
      Windows event code 4672 (special privileges assigned to new logon).
      Highlights administrative/privileged sessions. Field mapping mirrors the
      validated user-management queries; confirm winlog fields in the target env.
    recommended_refresh_frequency: Hourly

  - id: AI019
    category: Authentication & Access Changes
    name: Account Lockout
    status: validated
    validated: true
    purpose: Detect user account lockouts.
    esql_query: |
      FROM logs-*
      | WHERE event.code == "4740"
      | KEEP
          @timestamp,
          host.name,
          winlog.event_data.TargetUserName,
          winlog.event_data.SubjectUserName
      | SORT @timestamp DESC
    expected_output_fields:
      - "@timestamp"
      - host.name
      - winlog.event_data.TargetUserName
      - winlog.event_data.SubjectUserName
    notes: Windows event code 4740 (a user account was locked out).
    recommended_refresh_frequency: Hourly

  - id: AI020
    category: Authentication & Access Changes
    name: Password Reset
    status: validated
    validated: true
    purpose: Detect administrative password resets on accounts.
    esql_query: |
      FROM logs-*
      | WHERE event.code == "4724"
      | KEEP
          @timestamp,
          host.name,
          winlog.event_data.SubjectUserName,
          winlog.event_data.TargetUserName
      | SORT @timestamp DESC
    expected_output_fields:
      - "@timestamp"
      - host.name
      - winlog.event_data.SubjectUserName
      - winlog.event_data.TargetUserName
    notes: >-
      Windows event code 4724 (an attempt was made to reset an account's
      password). Actor is SubjectUserName; target is TargetUserName.
    recommended_refresh_frequency: Hourly

  - id: AI021
    category: Authentication & Access Changes
    name: Failed Logon
    status: validated
    validated: true
    purpose: Detect failed logon attempts (brute-force / credential misuse signal).
    esql_query: |
      FROM logs-*
      | WHERE event.code == "4625"
      | KEEP
          @timestamp,
          host.name,
          winlog.event_data.TargetUserName,
          source.ip,
          winlog.event_data.LogonType
      | SORT @timestamp DESC
    expected_output_fields:
      - "@timestamp"
      - host.name
      - winlog.event_data.TargetUserName
      - source.ip
      - winlog.event_data.LogonType
    notes: >-
      Windows event code 4625 (an account failed to log on). source.ip and
      LogonType support brute-force and remote-access analysis. High volume;
      bound with the time-range control.
    recommended_refresh_frequency: Hourly

  # ===========================================================================
  # SECURITY CONFIGURATION CHANGES
  # ===========================================================================

  - id: AI022
    category: Security Configuration Changes
    name: Scheduled Task Created
    status: validated
    validated: true
    purpose: Detect scheduled task creation (a common persistence mechanism).
    esql_query: |
      FROM logs-*
      | WHERE event.code == "4698"
      | KEEP
          @timestamp,
          host.name,
          winlog.event_data.SubjectUserName,
          winlog.event_data.TaskName
      | SORT @timestamp DESC
    expected_output_fields:
      - "@timestamp"
      - host.name
      - winlog.event_data.SubjectUserName
      - winlog.event_data.TaskName
    notes: >-
      Windows event code 4698 (a scheduled task was created). TaskName often
      requires XML parsing depending on the ingest pipeline; confirm the field.
    recommended_refresh_frequency: Hourly

  - id: AI023
    category: Security Configuration Changes
    name: Audit Policy Changed
    status: validated
    validated: true
    purpose: Detect changes to the system audit policy (log tampering signal).
    esql_query: |
      FROM logs-*
      | WHERE event.code == "4719"
      | KEEP
          @timestamp,
          host.name,
          winlog.event_data.SubjectUserName,
          winlog.event_data.CategoryId,
          winlog.event_data.SubcategoryGuid
      | SORT @timestamp DESC
    expected_output_fields:
      - "@timestamp"
      - host.name
      - winlog.event_data.SubjectUserName
      - winlog.event_data.CategoryId
      - winlog.event_data.SubcategoryGuid
    notes: Windows event code 4719 (system audit policy was changed).
    recommended_refresh_frequency: Hourly

  - id: AI024
    category: Security Configuration Changes
    name: Event Log Cleared
    status: validated
    validated: true
    purpose: Detect security event log clearing (anti-forensics signal).
    esql_query: |
      FROM logs-*
      | WHERE event.code == "1102"
      | KEEP
          @timestamp,
          host.name,
          winlog.event_data.SubjectUserName
      | SORT @timestamp DESC
    expected_output_fields:
      - "@timestamp"
      - host.name
      - winlog.event_data.SubjectUserName
    notes: >-
      Windows event code 1102 (the audit log was cleared). High-signal, low
      volume — clearing the log is a strong tampering indicator.
    recommended_refresh_frequency: Hourly

  - id: AI025
    category: Security Configuration Changes
    name: Host Firewall Rule Changed
    status: validated
    validated: true
    purpose: Detect Windows firewall rule add/modify/delete changes.
    esql_query: |
      FROM logs-*
      | WHERE event.code IN ("4946","4947","4948")
      | KEEP
          @timestamp,
          host.name,
          event.code,
          winlog.event_data.RuleName,
          winlog.event_data.RuleId
      | SORT @timestamp DESC
    expected_output_fields:
      - "@timestamp"
      - host.name
      - event.code
      - winlog.event_data.RuleName
      - winlog.event_data.RuleId
    notes: >-
      Windows firewall rule change events: 4946 (added), 4947 (modified),
      4948 (deleted). event.code identifies the change type.
    recommended_refresh_frequency: Hourly
