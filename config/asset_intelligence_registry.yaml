    category: Application Discovery
    name: Software Version Discovery
    status: not_validated
    validated: false
    purpose: Identify installed software and their versions across hosts.
    esql_query: ""   # TODO: query not yet defined - see notes.
    expected_output_fields:   # Proposed, pending field validation.
      - host.name
      - host.ip
      - package.name
      - package.version
    notes: >-
      Placeholder. No ES|QL defined yet and not validated against live data.
      Intended to surface installed software versions (e.g. via package.* fields
      or process.pe.* metadata); the source fields still need to be confirmed in
      the target environment before a query can be written. expected_output_fields
      above are proposed, not validated.
    recommended_refresh_frequency: Daily

  - id: AI017
    category: File Integrity Monitoring
    name: File Integrity Monitoring
    status: not_validated
    validated: false
    purpose: Detect create/modify/delete changes to monitored files.
    esql_query: ""   # TODO: query not yet defined - see notes.
    expected_output_fields:   # Proposed, pending field validation.
      - "@timestamp"
      - host.name
      - file.path
      - event.action
      - user.name
    notes: >-
      Placeholder. No ES|QL defined yet and not validated against live data.
