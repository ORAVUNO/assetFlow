  - id: AE015
    category: CMDB
    name: CMDB Configuration Items
    status: investigation_required
    validated: false
    resource: cmdb
    purpose: >-
      Inventory the CMDB configuration items across the configured CI types (server,
      workstation, router, switch, firewall, access point, printer, storage, UPS,
      network device, database, application, business service, …), each row stamped
      with its CI type so CIs land in their respective type in the unified inventory.
    expected_output_fields:
      - host.name          # CI name
      - asset.type         # CI type
      - ci.type            # CI type
      - host.ip            # ip_address
      - asset.state        # state / status
      - site
      - department
      - product
      - serial.number
      - updated.date
      - "custom.*"         # every udf_fields entry + any other extra field
    notes: >-
      GET /api/v3/cmdb/{ci_type} for each CI type in the configured set (override
      with AE_CMDB_CI_TYPES). Best-effort: a CI type the deployment does not have
      simply contributes no rows. Marked investigation_required because CI-type api
      names and their response shape vary by deployment / CMDB configuration; adjust
      AE_CMDB_CI_TYPES to your instance's CI types.
    recommended_refresh_frequency: Daily

