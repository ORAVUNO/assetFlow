# =============================================================================
# Tenable.sc (SecurityCenter) Asset Intelligence Registry
# =============================================================================
# Resource registry for the Tenable.sc adapter. Where the Elasticsearch registry
# carries ES|QL query bodies, each entry here names a `resource` that the
# Tenable.sc runner maps to one or more REST calls and normalizes into the same
# column/row shape (see assetflow/tenable_sc_runner.py).
#
# Two request shapes cover everything (see assetflow/tenable_sc_client.py):
#   - POST /rest/analysis with a *tool* — the workhorse for vulnerability / device
#     / software data:
#       * sumip        -> device inventory (one row per host)
#       * vulndetails  -> aggregated security findings (one row per detection)
#       * listsoftware -> installed-software enumeration
#     paged with startOffset / endOffset.
#   - GET /rest/{user,asset,alert,ticket} — the object listings for users, asset
#     lists (tags), alerts, and tickets (incidents).
#
# Authentication is a Tenable.sc session (username + password -> /rest/token,
# X-SecurityCenter header) or an access-key/secret-key pair. The account needs the
# Security Manager role with access to the required repositories.
#
# Custom fields & asset tags (asked for by the integration):
#   - Any device / finding field Tenable.sc returns that the runner does not map
#     to a named column is emitted under a `custom.` prefix, so extra fields are
#     captured, never dropped, and never confused with system fields.
#   - Each device row is stamped with the asset lists (tags) its IP belongs to in
#     a `tags` column; the asset_lists resource is the catalog of those tags.
#
# Status meanings match the other registries:
#   - validated              : Confirmed working against live data.
#   - partially_validated    : Endpoint/tool + field names follow Tenable's API
#                              docs / pyTenable; mapping is best-effort and needs
#                              confirming against a live Tenable.sc release.
#   - investigation_required : Endpoint exists but response shape / availability
#                              varies by Tenable.sc version or licensing.
#   - not_validated          : Not exercised against live data (placeholders).
# =============================================================================

metadata:
  version: 1
  description: >-
    Tenable.sc (SecurityCenter) asset intelligence — the device inventory
    (sumip), aggregated security findings (vulndetails), installed software
    (listsoftware), user accounts, asset lists (asset tags / groupings), alerts,
    and tickets (incidents) — over the Tenable.sc REST API. Device and finding
    rows carry any unmapped Tenable field under a `custom.` prefix and devices are
    stamped with their asset-list tags.
  query_language: Tenable.sc REST API (/rest/analysis + resource endpoints)
  status_values:
    - validated
    - partially_validated
    - investigation_required
    - not_validated
  categories:
    - Device Inventory
    - Security Findings
    - Software
    - Applications
    - Users
    - Asset Tags
    - Alerts & Incidents
    - SaaS Applications
    - Summaries

# =============================================================================
# FEEDS
# =============================================================================
feeds:
  - id: FEED-TSC-DEVICES
    name: Device Inventory
    category: Device Inventory
    description: Every host Tenable.sc has seen, with IP/DNS/MAC, OS, repository, vulnerability score and per-severity counts, last scan times, and asset-list tags.
    query_ids: [TSC001, TSC009]
    recommended_refresh_frequency: Daily

  - id: FEED-TSC-FINDINGS
    name: Security Findings
    category: Security Findings
    description: Aggregated security findings — one row per (host, plugin) detection with severity, port/protocol, CVEs, CVSS/VPR, synopsis, solution, and first/last seen.
    query_ids: [TSC002]
    recommended_refresh_frequency: Daily

  - id: FEED-TSC-SOFTWARE
    name: Software
    category: Software
    description: Installed software linked to each host, with name and version split into their own columns, plus running databases and their versions.
    query_ids: [TSC003, TSC010]
    recommended_refresh_frequency: Daily

  - id: FEED-TSC-APPS
    name: Applications
    category: Applications
    description: Notable applications per host, extracted from the software enumeration (web/app servers, databases, runtimes, containers, infra tools, desktop apps) — the OS libraries filtered out.
    query_ids: [TSC011]
    recommended_refresh_frequency: Daily

  - id: FEED-TSC-USERS
    name: Users
    category: Users
    description: Tenable.sc user accounts — role, group, org, auth type, status, and last login.
    query_ids: [TSC004]
    recommended_refresh_frequency: Weekly

  - id: FEED-TSC-ASSETS
    name: Asset Tags
    category: Asset Tags
    description: Asset lists — the asset tags / groupings defined in Tenable.sc, each with its tags, type, owner, and member-IP count.
    query_ids: [TSC005]
    recommended_refresh_frequency: Weekly

  - id: FEED-TSC-ALERTS
    name: Alerts & Incidents
    category: Alerts & Incidents
    description: Configured alerts and tickets (Tenable.sc's incident objects), with status, trigger/classification, assignee, and timestamps.
    query_ids: [TSC006, TSC007]
    recommended_refresh_frequency: Daily

  - id: FEED-TSC-SAAS
    name: SaaS Applications
    category: SaaS Applications
    description: SaaS application inventory (placeholder — not exposed by the Tenable.sc core API; a Tenable One / Tenable.io capability).
    query_ids: [TSC008]
    recommended_refresh_frequency: Daily

  - id: FEED-TSC-SUMMARY
    name: Summaries (host counts)
    category: Summaries
    description: Aggregated views — one row per vulnerability / package / application / database with a count of how many hosts it is on.
    query_ids: [TSC012, TSC013, TSC014, TSC015]
    recommended_refresh_frequency: Daily

# =============================================================================
# QUERIES (resources)
# =============================================================================
queries:
  - id: TSC001
    category: Device Inventory
    name: Devices (Host Inventory)
    status: validated
    validated: true
    resource: devices
    purpose: >-
      Inventory every host Tenable.sc has data for, one row per IP, with DNS /
      NetBIOS / MAC, OS (CPE), repository, overall vulnerability score and
      per-severity counts, last authenticated / unauthenticated scan times, the
      asset lists (tags) the host belongs to, and any extra Tenable field under
      custom.*.
    expected_output_fields:
      - host.name          # dnsName / netbiosName / ip (folds into unified host view)
      - asset.type         # constant "Host"
      - host.ip            # ip
      - host.dns           # dnsName
      - host.netbios       # netbiosName
      - host.mac           # macAddress
      - os                 # osCPE
      - repository         # repository.name
      - acr                # acrScore (Asset Criticality Rating; editable in the Plus tier)
      - aes                # assetExposureScore (Asset Exposure Score)
      - vuln.score         # score
      - vuln.total         # total
      - vuln.critical      # severityCritical
      - vuln.high          # severityHigh
      - vuln.medium        # severityMedium
      - vuln.low           # severityLow
      - vuln.info          # severityInfo
      - last.auth.scan     # lastAuthRun (epoch -> ISO)
      - last.unauth.scan   # lastUnauthRun (epoch -> ISO)
      - tags               # asset lists (tags) whose membership includes this IP
      - "custom.*"         # any extra field Tenable.sc returns for the host
    notes: >-
      POST /rest/analysis with type=vuln, sourceType=cumulative, tool=sumip,
      paged by startOffset/endOffset. Asset-tag enrichment builds an IP ->
      asset-list-name map from GET /rest/asset (bounded to the first 150 asset
      lists, each expanded via a sumip analysis filtered by assetID); it is
      best-effort and degrades to no tags on error. The time-range control adds a
      lastSeen filter (24h/7d/30d/90d). Field names target Tenable Security Center
      6.x (a 6.8.0 "Plus" deployment): 6.x adds acrScore / assetExposureScore to
      sumip. Any other field the release returns still rides along under custom.*.
    recommended_refresh_frequency: Daily

  - id: TSC002
    category: Security Findings
    name: Aggregated Security Findings
    status: validated
    validated: true
    resource: findings
    purpose: >-
      Fetch the aggregated security findings — one row per (host, plugin)
      detection — with severity, plugin family, port/protocol, CVEs, CVSS and VPR
      scores, risk factor, synopsis, solution, first/last seen, and mitigation
      status.
    expected_output_fields:
      - host.name          # dnsName / netbiosName / ip
      - host.ip            # ip
      - host.dns           # dnsName
      - host.mac           # macAddress
      - plugin.id          # pluginID
      - plugin.name        # pluginName
      - severity           # severity.name (Critical / High / Medium / Low / Info)
      - family             # family.name
      - port               # port
      - protocol           # protocol
      - cve                # cve
      - cvss.base          # baseScore
      - cvss.v3.base       # cvssV3BaseScore
      - vpr.score          # vprScore
      - risk.factor        # riskFactor
      - synopsis           # synopsis
      - solution           # solution
      - first.seen         # firstSeen (epoch -> ISO)
      - last.seen          # lastSeen (epoch -> ISO)
      - "custom.*"         # any extra field Tenable.sc returns for the finding
    notes: >-
      POST /rest/analysis with type=vuln, sourceType=cumulative, tool=vulndetails,
      paged by startOffset/endOffset. Informational plugins (severity Info — "Ping
      the remote host", scan info, OS fingerprints) are excluded by default via a
      severity filter (1-4), matching the Tenable vulnerabilities GUI; set
      TENABLE_SC_FINDINGS_SEVERITIES=all (or include 0) to keep them. Large text
      fields (pluginText, description, xref, …) are excluded from the custom.*
      sweep so the table stays legible. The time-range control adds a lastSeen filter.
    recommended_refresh_frequency: Daily

  - id: TSC003
    category: Software
    name: Installed Software (per host)
    status: validated
    validated: true
    resource: software
    purpose: >-
      Enumerate installed software linked to each host, one row per (host,
      package), with the software name and version split into their own columns
      (the original enumeration line is kept in software.raw). This lets software
      correlate to hosts/IPs in the unified inventory.
    expected_output_fields:
      - host.name          # dnsName / netbiosName / ip (folds into unified host view)
      - host.ip            # ip
      - host.dns           # dnsName
      - software.name      # product name parsed from the enumeration line
      - software.version   # version parsed from the enumeration line
      - software.raw       # the original, unparsed software line
      - plugin.id          # the enumeration plugin (20811 Windows / 22869 SSH)
      - last.seen          # lastSeen (epoch -> ISO)
    notes: >-
      POST /rest/analysis with tool=vulndetails filtered to the software-
      enumeration plugins (pluginID = 20811,22869), then each plugin's pluginText
      is split into individual package lines and each line into name + version.
      Formats handled (confirmed against a live 6.8 box): Debian/Ubuntu `dpkg -l`
      output (status flag + columns split on 2+ spaces), Windows "[version X]"
      lines, CPEs, and rpm-style name-version; <plugin_output> wrapper lines are
      dropped. This replaces the previous estate-wide listsoftware view so software
      links to hosts. Still investigation_required until the Windows (20811) format
      is also confirmed; the raw line always survives, so nothing is lost.
    recommended_refresh_frequency: Daily

  - id: TSC004
    category: Users
    name: Users
    status: validated
    validated: true
    resource: users
    purpose: >-
      List the Tenable.sc user accounts with role, group, organization, auth
      type, lock/status, and last login — for the unified Users inventory.
    expected_output_fields:
      - host.name          # username (folds into the unified Users view)
      - user.id            # id
      - username           # username
      - full.name          # firstname + lastname
      - email              # email
      - title              # title
      - role               # role.name
      - group              # group.name
      - org                # orgName
      - auth.type          # authType (tns / ldap / saml / linked)
      - locked             # locked
      - status             # status
      - last.login         # lastLogin (epoch -> ISO)
    notes: >-
      GET /rest/user?fields=... The endpoint returns a plain list; role and group
      are nested objects reduced to their name. Requires a role that can view
      users (Security Manager can view users in its organization).
    recommended_refresh_frequency: Weekly

  - id: TSC005
    category: Asset Tags
    name: Asset Lists (Tags)
    status: validated
    validated: true
    resource: asset_lists
    purpose: >-
      List the asset lists that model asset tags / groupings in Tenable.sc — each
      with its tags field, type (static / dynamic / dns / ldap / combination …),
      owner, group, and member-IP count. This is the catalog of the tags the
      device inventory (TSC001) stamps onto each host.
    expected_output_fields:
      - asset.name         # name
      - asset.id           # id
      - asset.type         # type
      - tags               # tags (the asset-list tag string)
      - description        # description
      - ip.count           # ipCount
      - owner              # owner.username
      - owner.group        # ownerGroup.name
      - status             # status
      - created            # createdTime (epoch -> ISO)
      - modified           # modifiedTime (epoch -> ISO)
    notes: >-
      GET /rest/asset?fields=... The response merges the usable + manageable
      buckets, de-duplicated by id. Asset lists are Tenable.sc's tagging /
      grouping primitive; TSC001 uses them to stamp per-device tags.
    recommended_refresh_frequency: Weekly

  - id: TSC006
    category: Alerts & Incidents
    name: Alerts
    status: validated
    validated: true
    resource: alerts
    purpose: >-
      List the configured Tenable.sc alerts with their trigger condition, status,
      whether they triggered on the last evaluation, last-triggered / last-
      evaluated times, and the actions taken.
    expected_output_fields:
      - alert.name         # name
      - alert.id           # id
      - description        # description
      - trigger            # triggerName triggerOperator triggerValue
      - status             # status
      - did.trigger.last   # didTriggerLastEvaluation
      - last.triggered     # lastTriggered (epoch -> ISO)
      - last.evaluated     # lastEvaluated (epoch -> ISO)
      - actions            # action[].type
      - owner              # owner.username
    notes: >-
      GET /rest/alert?fields=... The response merges usable + manageable. Actions
      are a list; their types are summarized.
    recommended_refresh_frequency: Daily

  - id: TSC007
    category: Alerts & Incidents
    name: Incidents (Tickets)
    status: validated
    validated: true
    resource: incidents
    purpose: >-
      List Tenable.sc tickets — its incident objects — with status,
      classification, assignee, owner, and assigned/created/modified times.
    expected_output_fields:
      - incident.name      # name
      - incident.id        # id
      - status             # status.name
      - classification     # classification
      - description        # description
      - assignee           # assignee.username
      - owner              # owner.username
      - assigned           # assignedTime (epoch -> ISO)
      - created            # createdTime (epoch -> ISO)
      - modified           # modifiedTime (epoch -> ISO)
    notes: >-
      GET /rest/ticket?fields=... The response merges usable + manageable. Status
      is a nested object reduced to its name.
    recommended_refresh_frequency: Daily

  - id: TSC008
    category: SaaS Applications
    name: SaaS Applications
    status: not_validated
    validated: false
    resource: saas_applications
    purpose: >-
      Inventory SaaS applications. Placeholder: the Tenable.sc (SecurityCenter)
      core REST API does not enumerate SaaS applications — that is a Tenable One /
      Tenable.io capability. The resource returns no rows so the asset type is
      visible with an honest empty result rather than silently missing.
    expected_output_fields:
      - application.name
      - vendor
      - note
    notes: >-
      No Tenable.sc endpoint provides SaaS application discovery. If the estate
      also runs Tenable.io / Tenable One, that data would come from a separate
      adapter against the Tenable Vulnerability Management API.
    recommended_refresh_frequency: Daily

  - id: TSC009
    category: Device Inventory
    name: Explore Assets (Hosts)
    status: validated
    validated: true
    resource: hosts
    purpose: >-
      Unified host inventory from the Tenable Security Center 6.x "Explore Assets"
      endpoint (/rest/hosts) — one row per asset in the 6.x asset model, with ACR
      (Asset Criticality Rating), AES (Asset Exposure Score), repositories, system
      type, and first/last seen. The modern companion to the sumip-based Devices
      resource (TSC001).
    expected_output_fields:
      - host.name        # name / dnsName / netbiosName / ipAddress
      - asset.type       # systemType (falls back to "Host")
      - host.ip          # ipAddress
      - host.dns         # dnsName
      - host.netbios     # netbiosName / netBios
      - host.mac         # macAddress
      - os               # os / osCPE
      - acr              # acrScore / assetCriticalityRating
      - aes              # assetExposureScore
      - repositories     # repositories[].name
      - first.seen       # firstSeen (epoch -> ISO)
      - last.seen        # lastSeen (epoch -> ISO)
      - uuid             # uuid / hostUUID / tenableUUID
      - "custom.*"       # any extra field the release returns
    notes: >-
      GET /rest/hosts?startOffset=&endOffset=&fields=..., paged like the analysis
      endpoint (falls back to an unfielded request if the fields selector is
      rejected, and to a plain list response shape). Field names are read with
      per-release fallbacks because 6.x renamed a few across point releases; marked
      investigation_required until the exact response shape is confirmed against a
      live 6.x box (the endpoint is new in the 6.x line). Requires Tenable Security
      Center 6.x; older releases won't expose /rest/hosts (the resource returns no
      rows there — use TSC001 instead). Bare "ping-only" hosts (known IPs with no
      name / OS / MAC / repository) are dropped by default so the view isn't
      flooded with empty rows; set TENABLE_SC_HOSTS_INCLUDE_BARE=true to keep them.
    recommended_refresh_frequency: Daily

  - id: TSC010
    category: Software
    name: Databases (per host)
    status: validated
    validated: true
    resource: databases
    purpose: >-
      Inventory the running databases and their versions, linked to each host —
      which database products (MySQL, Microsoft SQL Server, Oracle, PostgreSQL,
      MongoDB, …) are running where, on which port, with a parsed version.
    expected_output_fields:
      - host.name          # dnsName / netbiosName / ip
      - host.ip            # ip
      - host.dns           # dnsName
      - database           # product parsed from the detection plugin name
      - version            # version parsed from the plugin name / output
      - port               # service port
      - protocol           # protocol
      - plugin.id          # detection pluginID
      - plugin.name        # detection plugin name (kept for reference)
      - last.seen          # lastSeen (epoch -> ISO)
    notes: >-
      Resolves the "Databases" plugin family id via GET /rest/pluginFamily, then
      POST /rest/analysis with tool=vulndetails filtered to that family; the
      database product is normalized to a clean label (MySQL / MariaDB / Oracle
      Database / Microsoft SQL Server / PostgreSQL / …) via keyword match on the
      plugin name, and the version is taken from the plugin output's "Version : X"
      line (falling back to a version token in the plugin name; the record's own
      version field is deliberately ignored — it is the Nessus plugin revision,
      not the database version, e.g. 1.49). The full plugin name
      is always kept in plugin.name. Confirmed working against a live 6.8 box; still
      investigation_required because the family includes some vulnerability plugins
      (not only detections), so filter plugin.name if you want detections only.
    recommended_refresh_frequency: Daily

  - id: TSC011
    category: Applications
    name: Applications (per host)
    status: validated
    validated: true
    resource: applications
    purpose: >-
      Extract the notable applications from the per-host software enumeration —
      web/app servers, databases, runtimes, containers, infra tooling and desktop
      apps — dropping the OS libraries and dev/support packages that dominate a
      raw package list. Emits application.name so it folds into the unified
      Applications inventory as real apps, linked to the host.
    expected_output_fields:
      - host.name          # dnsName / netbiosName / ip
      - host.ip            # ip
      - host.dns           # dnsName
      - application.name   # the application package name (keys the Applications inventory)
      - application.version
      - software.raw       # the original enumeration line
      - plugin.id          # 20811 Windows / 22869 SSH
      - last.seen          # lastSeen (epoch -> ISO)
    notes: >-
      Same enumeration as TSC003 (plugins 20811 / 22869 via vulndetails), then
      filtered: every Windows installed-software entry is kept (they are already
      applications), and Linux packages are kept when the name matches an
      application keyword (apache, nginx, mysql, postgresql, docker, tomcat,
      openjdk, php, chrome, office, …). Extend the keyword list with
      TENABLE_SC_APP_KEYWORDS (comma-separated). Marked investigation_required
      because the allowlist is necessarily curated — widen it for your estate as
      needed; TSC003 remains the complete package inventory.
    recommended_refresh_frequency: Daily

  - id: TSC012
    category: Summaries
    name: Vulnerability Summary (hosts affected)
    status: validated
    validated: true
    resource: findings_summary
    purpose: >-
      Aggregate the security findings by plugin — one row per vulnerability with
      the number of hosts it affects, its severity, family, and CVSS/VPR. Answers
      "how widespread is this vulnerability?".
    expected_output_fields:
      - plugin.id
      - plugin.name
      - severity
      - family
      - host.count      # hostTotal — number of hosts affected
      - total
      - vpr.score
      - cvss.v3.base
    notes: >-
      POST /rest/analysis tool=sumid (Tenable computes the per-plugin host total),
      with the same Info-excluded severity filter as TSC002. Sorted most-widespread
      first. Not host-keyed (a summary row is not a single host).
    recommended_refresh_frequency: Daily

  - id: TSC013
    category: Summaries
    name: Software Summary (hosts per package)
    status: validated
    validated: true
    resource: software_summary
    purpose: >-
      Aggregate installed software across the estate — one row per distinct
      package with the number of hosts it appears on. Answers "how many machines
      have package X?".
    expected_output_fields:
      - software.name
      - host.count      # count — number of hosts
      - cpe
    notes: >-
      POST /rest/analysis tool=listsoftware, which returns the host count natively.
      Sorted most-common first. Not host-keyed.
    recommended_refresh_frequency: Daily

  - id: TSC014
    category: Summaries
    name: Application Summary (hosts per app)
    status: validated
    validated: true
    resource: application_summary
    purpose: >-
      Aggregate the notable applications — one row per application with the number
      of hosts it runs on and the distinct versions seen. Answers "how many servers
      run Apache / MySQL / Docker?".
    expected_output_fields:
      - application.name
      - host.count      # number of distinct hosts the app is on
      - versions        # distinct versions seen (first few)
    notes: >-
      Groups the applications resource (TSC011) by application name and counts
      distinct hosts. Same curated allowlist as TSC011 (extend with
      TENABLE_SC_APP_KEYWORDS). Not host-keyed.
    recommended_refresh_frequency: Daily

  - id: TSC015
    category: Summaries
    name: Database Summary (hosts per database)
    status: validated
    validated: true
    resource: database_summary
    purpose: >-
      Aggregate the running databases — one row per database product with the
      number of hosts it runs on and the distinct versions seen. Answers "how many
      servers run MySQL / Oracle / MSSQL?".
    expected_output_fields:
      - database
      - host.count      # number of distinct hosts the database is on
      - versions        # distinct versions seen (first few)
    notes: >-
      Groups the databases resource (TSC010) by product and counts distinct hosts.
      Not host-keyed.
    recommended_refresh_frequency: Daily
