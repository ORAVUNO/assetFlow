[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assetflow"
version = "0.1.0"
description = "Preloaded Elastic Asset Intelligence query registry and runner"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "elasticsearch>=8.11,<10",
    "PyYAML>=6.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "SQLAlchemy>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27"]
# Optional: the VMware adapter only needs pyVmomi for vCenter Custom Attributes
# (columns prefixed `custom.`). Standard inventory works without it.
vmware = ["pyvmomi>=8.0"]
# Optional: the Active Directory adapter needs ldap3 to talk LDAP; cryptography
# adds subject/issuer/validity/EKU parsing for certificates (thumbprints work
# without it).
active_directory = ["ldap3>=2.9", "cryptography>=41.0"]

[project.scripts]
assetflow = "assetflow.cli:main"

[tool.setuptools]
packages = ["assetflow"]
